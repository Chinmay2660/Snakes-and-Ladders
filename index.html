<!doctype html>
<html lang="en">
<script>try{var t=localStorage.getItem("snl-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}</script>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An accessible Snakes& Ladders game built with React, Redux Toolkit, TypeScript, and TailwindCSS."
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>Snakes &amp; Ladders</title>
    <!-- Preconnect to external domains for faster DNS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <!-- Critical CSS inline for faster FCP -->
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: white;
      }
      #root {
        min-height: 100vh;
      }
      /* Prevent layout shift */
      .bg-slate-900 {
        background-color: #0f172a;
      }
    </style>
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>
  <body class="bg-slate-900">
    <div id="root">
      <!-- Initial loading state to prevent CLS -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="color: white; font-size: 18px;">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
